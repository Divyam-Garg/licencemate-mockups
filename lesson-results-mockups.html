<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LicenceMate · Lesson Estimate Quiz — Results page mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sansita:wght@700;800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* LicenceMate brand */
    --green-50:  #f0fdf4;
    --green-100: #dcfce7;
    --green-200: #bbf7d0;
    --green-400: #4ade80;
    --green-500: #22c55e;
    --green-600: #16a34a;
    --green-700: #15803d;
    --green-800: #166534;
    --green-950: #052e16;
    --yellow-200: #fef08a;
    --yellow-300: #fde047;
    --yellow-400: #facc15;

    --primary: var(--green-600);
    --primary-hover: var(--green-700);
    --primary-tint: var(--green-50);
    --primary-soft: var(--green-100);

    --bg: #fafdfb;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --text: #111828;
    --text-muted: #4b5563;
    --text-soft: #6b7280;
    --border: #e5e7eb;
    --border-soft: var(--green-100);
    --border-strong: #d1d5db;

    --success: var(--green-600);
    --warning-bg: #fffbeb;
    --warning-border: #f59e0b;
    --warning-text: #78350f;

    --radius:    0.625rem;
    --radius-sm: calc(var(--radius) - 4px);
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 6px);

    --shadow-sm: 0 1px 2px rgba(17,24,40,.04), 0 1px 3px rgba(17,24,40,.06);
    --shadow-md: 0 8px 18px -6px rgba(22,163,74,.12), 0 4px 8px -2px rgba(17,24,40,.04);
    --shadow-lg: 0 24px 48px -18px rgba(21,128,61,.30);
    --shadow-glow: 0 0 0 0 rgba(34,197,94,.55);

    --font-sansita: "Sansita", Georgia, ui-serif, serif;
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  h1, h2, h3, h4 {
    margin: 0;
    font-family: var(--font-sansita);
    font-weight: 700;
    letter-spacing: -0.005em;
  }
  p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--primary); text-decoration: none; }

  /* ---------- Page shell ---------- */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar img { width: 32px; height: 32px; }
  .topbar .wordmark {
    font-family: var(--font-sansita);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .topbar .wordmark .l { color: var(--green-700); }
  .topbar .wordmark .m { color: var(--text); }
  .topbar .crumb {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--text-soft);
  }

  .page-header {
    background: linear-gradient(180deg, #fff 0%, #f7fdf9 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 0;
  }
  .page-header h1 {
    font-size: 22px;
    font-family: var(--font-sansita);
  }
  .page-header p {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-top: 6px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 20px;
    overflow-x: auto;
  }
  .tabs button {
    background: transparent;
    border: 0;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active {
    color: var(--green-700);
    border-bottom-color: var(--green-600);
    font-weight: 600;
  }
  .persona-bar {
    background: var(--surface);
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .persona-bar .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-soft);
    font-weight: 600;
    margin-right: 8px;
  }
  .persona-bar button {
    background: #fff;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all .15s;
  }
  .persona-bar button:hover { color: var(--text); border-color: var(--green-200); background: var(--green-50); }
  .persona-bar button.active {
    background: var(--green-600);
    color: #fff;
    border-color: var(--green-600);
  }

  .stage {
    padding: 40px 32px 80px;
    display: flex;
    justify-content: center;
  }
  .stage-inner {
    width: 100%;
    max-width: 880px;
  }
  .variation-meta {
    margin-bottom: 24px;
  }
  .variation-meta h2 {
    font-size: 12px;
    font-family: var(--font-sans);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--green-700);
  }
  .variation-meta h3 {
    font-family: var(--font-sansita);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin-top: 4px;
    color: var(--text);
  }
  .variation-meta p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 6px;
    max-width: 660px;
  }

  /* ---------- Shared primitives ---------- */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 22px;
    background: var(--green-600);
    color: #fff;
    border: 0;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 14.5px;
    font-family: var(--font-sans);
    box-shadow: 0 4px 12px -4px rgba(22,163,74,.45);
    transition: background .15s, transform .05s, box-shadow .15s;
  }
  .btn-primary:hover { background: var(--green-700); box-shadow: 0 6px 18px -4px rgba(21,128,61,.55); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: #fff;
    color: var(--green-700);
    border: 1px solid var(--green-200);
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 14px;
  }

  .warning-banner {
    display: flex;
    gap: 12px;
    background: var(--warning-bg);
    border: 1px solid #fde68a;
    border-left: 4px solid var(--warning-border);
    color: var(--warning-text);
    padding: 14px 16px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  .warning-banner .icon { flex-shrink: 0; }
  .warning-banner strong { font-weight: 700; display: block; margin-bottom: 2px; font-family: var(--font-sansita); }

  .roadmap-eyebrow {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--green-700);
    font-weight: 600;
    margin: 36px 0 8px;
  }

  /* ---------- Variation A: 3-phase roadmap ---------- */
  .vA-hero {
    background: linear-gradient(135deg, var(--green-600) 0%, var(--green-700) 100%);
    color: #fff;
    border-radius: var(--radius-xl);
    padding: 40px 32px;
    text-align: center;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }
  .vA-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 80% 20%, rgba(255,255,255,.15), transparent 50%);
    pointer-events: none;
  }
  .vA-hero .eyebrow {
    font-size: 13px;
    color: rgba(255,255,255,.85);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 600;
  }
  .vA-hero .estimate {
    font-family: var(--font-sansita);
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 12px 0 4px;
    color: #fff;
    line-height: 1.05;
    text-shadow: 0 2px 16px rgba(0,0,0,.18);
  }
  .vA-hero .estimate small {
    font-size: 17px;
    color: rgba(255,255,255,.92);
    font-weight: 500;
    letter-spacing: 0;
    display: block;
    margin-top: 4px;
    font-family: var(--font-sans);
  }
  .vA-hero .subtitle {
    color: rgba(255,255,255,.92);
    font-size: 15px;
    margin: 12px auto 24px;
    max-width: 480px;
  }
  .vA-hero .btn-primary {
    background: #fff;
    color: var(--green-700);
    box-shadow: 0 8px 22px -8px rgba(0,0,0,.35);
  }
  .vA-hero .btn-primary:hover { background: var(--green-50); }

  .vA-phases-track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 8px 28px;
  }
  .vA-phase-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    flex: 0 0 auto;
    width: 110px;
  }
  .vA-phase-node .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--green-600);
    box-shadow: 0 0 0 5px var(--green-100);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    font-family: var(--font-sansita);
  }
  .vA-phase-node:not(:first-child) .dot {
    background: #fff;
    border: 2px solid var(--green-200);
    color: var(--green-700);
    box-shadow: none;
  }
  .vA-phase-node .label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .vA-phases-line {
    flex: 1;
    height: 2px;
    background: var(--green-200);
    margin: 0 -8px;
    align-self: center;
    position: relative;
    top: -16px;
  }
  .vA-phase-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 28px;
  }
  .vA-phase-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
  }
  .vA-phase-card .head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .vA-phase-card .pill {
    background: var(--green-100);
    color: var(--green-800);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    font-family: var(--font-sans);
  }
  .vA-phase-card h4 {
    font-size: 19px;
    font-family: var(--font-sansita);
    font-weight: 700;
  }
  .vA-phase-card ul {
    list-style: none;
    padding: 0;
    margin: 6px 0 0;
  }
  .vA-phase-card li {
    color: var(--text-muted);
    font-size: 14.5px;
    padding: 6px 0 6px 22px;
    position: relative;
  }
  .vA-phase-card li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 14px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green-500);
  }

  /* ---------- Variation B: two-column ---------- */
  .vB-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .vB-grid { grid-template-columns: 1fr; }
  }
  .vB-left {
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: 28px 24px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--green-100);
    position: sticky;
    top: 24px;
    overflow: hidden;
    position: relative;
  }
  .vB-left::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--green-500), var(--green-700));
  }
  .vB-left .eyebrow {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--green-700);
    font-weight: 700;
  }
  .vB-left .estimate {
    font-family: var(--font-sansita);
    font-size: 52px;
    font-weight: 800;
    color: var(--green-700);
    letter-spacing: -0.03em;
    margin-top: 6px;
    line-height: 1;
  }
  .vB-left .sessions {
    color: var(--text-muted);
    font-size: 14px;
    margin: 8px 0 18px;
  }
  .vB-left .basedOn {
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 6px;
  }
  .vB-left .basedOn strong {
    font-family: var(--font-sansita);
    font-weight: 700;
    color: var(--text);
    font-size: 13px;
  }
  .vB-left .basedOn ul {
    list-style: none;
    padding: 0;
    margin: 8px 0 0;
  }
  .vB-left .basedOn li {
    padding: 3px 0 3px 22px;
    position: relative;
  }
  .vB-left .basedOn li::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--green-600);
    font-weight: 700;
  }
  .vB-left .package {
    margin-top: 20px;
    padding: 14px;
    background: var(--green-50);
    border: 1px solid var(--green-100);
    border-radius: var(--radius-md);
  }
  .vB-left .package .pkg-eyebrow {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--green-700);
    font-weight: 700;
  }
  .vB-left .package .pkg-name {
    font-family: var(--font-sansita);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
  }
  .vB-left .cta { margin-top: 18px; width: 100%; justify-content: center; }

  .vB-right {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 8px 0;
    box-shadow: var(--shadow-sm);
  }
  .vB-right h4 {
    font-family: var(--font-sansita);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    padding: 20px 24px 12px;
  }
  .vB-step {
    display: flex;
    gap: 14px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .vB-step .num {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--green-100);
    color: var(--green-800);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13.5px;
    font-family: var(--font-sansita);
  }
  .vB-step .body .title {
    font-size: 15px;
    font-weight: 600;
  }
  .vB-step .body .detail {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ---------- Variation C: timeline expandable ---------- */
  .vC-hero {
    background: linear-gradient(135deg, #fff 0%, var(--green-50) 100%);
    border: 1px solid var(--green-100);
    border-radius: var(--radius-xl);
    padding: 24px 28px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .vC-hero .headline {
    font-family: var(--font-sansita);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .vC-hero .headline strong {
    color: var(--green-700);
    font-weight: 800;
  }
  .vC-hero .sub {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 6px;
    font-family: var(--font-sans);
    font-weight: 400;
  }
  .vC-list {
    margin-top: 24px;
    position: relative;
  }
  .vC-list::before {
    content: "";
    position: absolute;
    left: 19px;
    top: 16px;
    bottom: 16px;
    width: 2px;
    background: var(--green-100);
  }
  .vC-step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 10px;
    position: relative;
    margin-left: 48px;
    box-shadow: var(--shadow-sm);
  }
  .vC-step summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
  }
  .vC-step summary::-webkit-details-marker { display: none; }
  .vC-step .num-circle {
    position: absolute;
    left: -48px;
    top: 12px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--green-200);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--green-700);
    font-family: var(--font-sansita);
  }
  .vC-step[data-current="true"] .num-circle {
    background: var(--green-600);
    color: #fff;
    border-color: var(--green-600);
    box-shadow: 0 0 0 5px var(--green-100);
  }
  .vC-step[data-current="true"] {
    border-color: var(--green-200);
    box-shadow: 0 8px 18px -6px rgba(22,163,74,.18);
  }
  .vC-step .chev {
    color: var(--text-soft);
    transition: transform .15s;
  }
  .vC-step[open] .chev { transform: rotate(180deg); }
  .vC-step .detail-body {
    padding: 0 20px 18px;
    color: var(--text-muted);
    font-size: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .vC-step .detail-body a {
    display: inline-block;
    margin-top: 10px;
    font-weight: 600;
  }

  /* ---------- Variation D: progress checklist ---------- */
  .vD-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--green-100);
    padding: 32px;
    box-shadow: var(--shadow-md);
  }
  .vD-progress-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .vD-progress-head .plan-eyebrow {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--green-700);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .vD-progress-head .headline {
    font-family: var(--font-sansita);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.015em;
  }
  .vD-progress-head .pct {
    font-family: var(--font-sansita);
    font-size: 40px;
    font-weight: 800;
    color: var(--green-700);
    letter-spacing: -0.025em;
    line-height: 1;
  }
  .vD-bar {
    height: 12px;
    background: var(--green-50);
    border: 1px solid var(--green-100);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .vD-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-500), var(--green-700));
    border-radius: 999px;
    transition: width .4s ease;
    box-shadow: 0 0 12px rgba(34,197,94,.6);
  }
  .vD-bar-sub {
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  .vD-cta-row { margin-bottom: 28px; }
  .vD-checklist {
    list-style: none;
    padding: 0;
    margin: 0;
    border-top: 1px solid var(--border);
  }
  .vD-check-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .vD-check-item .marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--border-strong);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .vD-check-item.done .marker {
    background: var(--green-600);
    color: #fff;
    border-color: var(--green-600);
  }
  .vD-check-item.done .text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: rgba(0,0,0,.18);
  }

/* ----------------- State management ----------------- */
const RESULTS_STORAGE_KEY = "lm.results.state";
let resultsState = {};

function loadResultsState() {
  try { resultsState = JSON.parse(localStorage.getItem(RESULTS_STORAGE_KEY) || "{}") || {}; }
  catch { resultsState = {}; }
  const params = new URLSearchParams(location.search);
  if (params.has("p") && PERSONAS[params.get("p")]) currentPersona = params.get("p");
  if (params.has("v") && VARIATION_META[params.get("v")]) currentVar = params.get("v");
  if (params.has("needs_vort")) resultsState.needsVort = params.get("needs_vort");
  if (params.has("fail")) resultsState.failType = params.get("fail");
}

function saveResultsState() {
  localStorage.setItem(RESULTS_STORAGE_KEY, JSON.stringify(resultsState));
  const params = new URLSearchParams();
  params.set("v", currentVar);
  params.set("p", currentPersona);
  if (resultsState.needsVort) params.set("needs_vort", resultsState.needsVort);
  if (resultsState.failType)  params.set("fail", resultsState.failType);
  history.replaceState(null, "", "?" + params.toString());
}

window.setDecision = function(key, value) {
  resultsState[key] = value;
  saveResultsState();
  render();
};

window.clearDecision = function(key) {
  delete resultsState[key];
  saveResultsState();
  render();
};

window.copyShareLink = function(btn) {
  navigator.clipboard.writeText(location.href).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ Copied to clipboard";
    setTimeout(() => btn.textContent = orig, 1800);
  }).catch(() => {
    btn.textContent = "Copy failed";
  });
};

window.toggleStep = function(e, el) {
  // Don't toggle if user clicked a link / button / input / label inside the body
  const tag = e.target.tagName;
  if (tag === 'A' || tag === 'BUTTON' || tag === 'INPUT' || tag === 'LABEL') return;
  // Don't toggle if the click originated inside the already-expanded body
  if (e.target.closest('.vD-step-body')) return;
  el.classList.toggle('expanded');
};

  let focusInserted = false;
  const rowsHTML = allChecks.map(c => {
    let prefix = '';
    if (c.current && !focusInserted) {
      prefix = `<li class="vD-focus-row"><div class="vD-focus-label">Right now, focus on</div></li>`;
      focusInserted = true;
    }
    const cls = c.done ? 'done' : c.current ? 'current' : c.warning ? 'warning' : '';
    const mark = c.done ? '✓' : c.warning ? '!' : '';

    if (c.current) {
      const linksHTML = c.links && c.links.length
        ? `<div class="vD-current-links">${c.links.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join('')}</div>`
        : '';
      const decisionHTML = c.decision ? renderDecisionUI(c.decision, resultsState[c.decision.key]) : '';
      const detailHTML = (c.long || linksHTML || decisionHTML)
        ? `<div class="vD-current-detail">${c.long || ''}${linksHTML}${decisionHTML}</div>`
        : '';
      return prefix + `<li class="vD-check-item current">
        <div class="vD-current-header">
          <div class="marker">${mark}</div>
          <div class="text">${esc(c.text)}<span class="sub">${esc(c.sub || "")}</span></div>
          <span class="you-are-here">You are here</span>
        </div>
        ${detailHTML}
      </li>`;
    }

    if (c.long) {
      return prefix + `<li class="vD-check-item expandable ${cls}" onclick="toggleStep(event, this)">
        <div class="vD-step-header">
          <div class="marker">${mark}</div>
          <div class="text">${esc(c.text)}<span class="sub">${esc(c.sub || "")}</span></div>
          <span class="chev">▾</span>
        </div>
        <div class="vD-step-body">${c.long}</div>
      </li>`;
    }

    return prefix + `<li class="vD-check-item ${cls}">
      <div class="marker">${mark}</div>
      <div class="text">${esc(c.text)}<span class="sub">${esc(c.sub || "")}</span></div>
      ${c.decisionKey ? `<button class="vD-change-answer" onclick="event.stopPropagation(); clearDecision('${esc(c.decisionKey)}')">Change answer</button>` : ''}
    </li>`;
  }).join('');

  const tipsHTML = (p.tips || []).map(t => `
    <div class="vD-tip">
      <span class="icon">💡</span>
      <div><strong>${esc(t.title)}</strong>${esc(t.body)}</div>
    </div>`).join('');

  const hoursDisplay = p.hours === 0 ? "No more lessons needed" : `${p.hours} hours of lessons until VORT-ready`;
  const successHTML = p.successCallout
    ? `<div class="vD-success-callout"><span class="icon">🎉</span><div><strong>${esc(p.successCallout.title)}</strong>${esc(p.successCallout.body)}</div></div>`
    : '';
  const packageHTML = p.package
    ? `<div class="vD-package-strip">
         <span class="pkg-icon">📦</span>
         <div>
           <div class="pkg-eyebrow">Recommended package</div>
           <div class="pkg-name">${esc(p.package)}</div>
         </div>
         <a class="pkg-link" href="#">See details →</a>
       </div>`
    : '';

  return `
  <div class="vD-save-bar">
    <span class="indicator-dot"></span>
    <span><span class="indicator">${esc(p.planName)} — saved automatically.</span> Bookmark this page or copy the link to come back any time.</span>
    <button class="copy-btn" onclick="copyShareLink(this)">Copy link</button>
  </div>

  ${renderWarning(p)}
  ${successHTML}

  <div class="vD-card">
    <div class="vD-progress-head">
      <div>
        <div class="plan-eyebrow">${esc(p.planName)}</div>
        <div class="headline">${esc(p.headline)}</div>
        <div style="color:var(--text-muted);font-size:14px;margin-top:4px;">${esc(hoursDisplay)}.</div>
      </div>
      <div class="pct">${p.progressPct}%</div>
    </div>
    <div class="vD-bar"><div class="fill" style="width:${p.progressPct}%"></div></div>
    <div class="vD-bar-sub">You're ${p.progressPct}% of the way to your P-plates.</div>
    <div class="vD-cta-row"><button class="btn-primary">${esc(p.ctaLabel)}</button></div>

    ${renderTimeline(p.timeline)}
    ${packageHTML}
    ${tipsHTML}

    <ul class="vD-checklist">${rowsHTML}</ul>
  </div>

  ${renderWhyLicenceMate()}
  ${renderFAQ()}
  `;
}

function renderE(p) {
  const ribbon = p.warning ? 'with-ribbon' : '';
  return `
  <div class="vE-pass ${ribbon}">
    <div class="vE-brandbar">
      <img src="licencemate_logo.png" alt="" />
      LicenceMate · Boarding pass to your P-plates
    </div>
    <div class="vE-pass-body">
      <div class="vE-cell">
        <div class="label">Estimated Prep</div>
        <div class="value">${p.hours} hrs <small>· ${p.sessions} sessions</small></div>
      </div>
      <div class="vE-cell">
        <div class="label">Recommended</div>
        <div class="value" style="font-size:19px;">${esc(p.package)}</div>
      </div>
    </div>
    <div class="vE-divider"></div>
    <div class="vE-milestones">
      <div class="label">Your milestones to P-plates</div>
      <div class="vE-stones">
        ${p.milestones.map(m => `
          <div class="vE-stone ${m.active ? 'active' : ''}">
            <div class="icon">${m.icon}</div>
            <div class="name">${esc(m.name)}</div>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="vE-cta-wrap">
      <button class="vE-cta">Book a Lesson</button>
    </div>
  </div>
  <div class="vE-footnote">Tap any milestone for details.</div>`;
}

const RENDERERS = { A: renderA, B: renderB, C: renderC, D: renderD, E: renderE };

/* ----------------- Switcher ----------------- */
let currentVar = "A";
let currentPersona = "confident";

function render() {
  const p = PERSONAS[currentPersona];
  const meta = VARIATION_META[currentVar];
  document.getElementById("meta").innerHTML = `
    <h2>${meta.kicker}</h2>
    <h3>${meta.title}</h3>
    <p>${meta.desc} <span style="color:var(--text-soft);"> · Persona: ${esc(p.name)}</span></p>
  `;
  document.getElementById("mount").innerHTML = RENDERERS[currentVar](p);
}

function setActiveTab(containerId, attr, value) {
  document.querySelectorAll(`#${containerId} button`).forEach(x => x.classList.remove("active"));
  const target = document.querySelector(`#${containerId} button[${attr}="${value}"]`);
  if (target) target.classList.add("active");
}

document.getElementById("variation-tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-var]");
  if (!b) return;
  currentVar = b.dataset.var;
  setActiveTab("variation-tabs", "data-var", currentVar);
  saveResultsState();
  render();
});

document.getElementById("persona-bar").addEventListener("click", e => {
  const b = e.target.closest("button[data-persona]");
  if (!b) return;
  currentPersona = b.dataset.persona;
  setActiveTab("persona-bar", "data-persona", currentPersona);
  saveResultsState();
  render();
});

loadResultsState();
setActiveTab("variation-tabs", "data-var", currentVar);
setActiveTab("persona-bar", "data-persona", currentPersona);
render();
</script>
</body>
</html>
